name: Stress tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show compiler versions
        run: |
          clang++ --version
          g++ --version

      - name: Run stress suite
        run: stress/run.sh
