name: Stress tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show tool versions
        run: |
          clang++ --version
          clang-format-17 --version
          g++ --version

      - name: Check C++ formatting
        run: find src stress -name '*.cpp' -print0 | xargs -0 clang-format-17 --style=file --dry-run --Werror

      - name: Run stress suite
        run: stress/run.sh
